<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Desktop Tooling">
  <defs>
    <linearGradient id="tile" x1="24" y1="12" x2="232" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101820"/>
      <stop offset="1" stop-color="#1C2A3A"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#tile)"/>
  <g transform="translate(128 128) scale(0.88) translate(-128 -128)">
    <!-- Monitor (desktop) -->
    <rect x="44" y="32" width="168" height="118" rx="10" fill="#243140" stroke="#E8A838" stroke-width="7"/>
    <rect x="54" y="42" width="148" height="88" rx="6" fill="#1C2A3A"/>
    <!-- Tool inside the screen -->
    <g fill="none" stroke="#C9D4E0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="116" y="56" width="24" height="30" rx="5" fill="#1C2A3A"/>
      <line x1="128" y1="86" x2="128" y2="116"/>
      <line x1="116" y1="116" x2="140" y2="116"/>
    </g>
    <!-- Stand -->
    <rect x="108" y="150" width="40" height="28" rx="2" fill="#243140" stroke="#E8A838" stroke-width="5"/>
    <rect x="76" y="178" width="104" height="14" rx="7" fill="#E8A838"/>
  </g>
</svg>
